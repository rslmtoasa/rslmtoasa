name: Generate runner-native reference artifacts (temporary)

# Deliberately non-mutating workflow.  It builds and runs the reference
# generator on each supported CI runner and uploads the resulting values for
# review.  It never commits or replaces the references in git.
on:
  # Temporary branch-local trigger: workflow_dispatch is only runnable when
  # the workflow file exists on the repository default branch.  Remove this
  # push trigger after the platform-native references have been collected.
  push:
    branches:
      - fable_v3
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to generate references from (defaults to the current ref)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    name: Generate references on ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-x86_64
          - runner: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            ninja-build cmake gfortran \
            libopenblas-dev liblapack-dev \
            openmpi-bin openmpi-common libopenmpi-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in ninja cmake open-mpi; do
            if ! brew list --versions "$pkg" >/dev/null 2>&1; then
              brew install "$pkg"
            fi
          done
          gfc=$(ls "$(brew --prefix)/bin/gfortran-"* 2>/dev/null | sort -V | tail -1)
          test -n "$gfc"
          sudo ln -sf "$gfc" "$(brew --prefix)/bin/gfortran"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install f90nml

      - name: Generate runner-native references
        run: |
          set -euo pipefail
          artifact_root="runner-native-${{ matrix.artifact }}"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root/scf/references" \
            "$artifact_root/postproc/references" \
            "$artifact_root/regression/references"

          python tests/generate_ci_references.py \
            --profile runner-native \
            --build-dir build \
            --cases-json tests/scf/cases.json \
            --references-dir "$artifact_root/scf/references" \
            --scratch-root "$artifact_root/scf/scratch"

          python tests/generate_ci_references.py \
            --profile runner-native \
            --build-dir build \
            --cases-json tests/postproc/cases.json \
            --references-dir "$artifact_root/postproc/references" \
            --scratch-root "$artifact_root/postproc/scratch"

          mapfile -t regression_cases < <(
            python -c 'import json; print("\n".join(c["name"] for c in json.load(open("tests/regression/cases.json"))["cases"]))'
          )
          for case_name in "${regression_cases[@]}"; do
            python tests/regression/run_matrix.py \
              --binary build/bin/rslmto.x \
              --cases-json tests/regression/cases.json \
              --case-name "$case_name" \
              --scratch-root "$artifact_root/regression/scratch" \
              --references "$artifact_root/regression/references" \
              --gen-ref
          done

          mkdir -p "$artifact_root/build/bin"
          cp build/bin/rslmto.x "$artifact_root/build/bin/rslmto.x"
          cp build/CMakeCache.txt "$artifact_root/build/CMakeCache.txt"
          git rev-parse HEAD > "$artifact_root/GENERATED_FROM_COMMIT"

      - name: Upload runner-native references
        uses: actions/upload-artifact@v7
        with:
          name: rslmto-runner-native-references-${{ matrix.artifact }}-${{ github.sha }}
          path: runner-native-${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
