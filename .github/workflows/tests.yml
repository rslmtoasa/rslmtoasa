name: Example tests

# Runs directly from the checked-out branch. The test workflow builds its own
# binary, so it does not depend on another workflow's artifacts or definition.
on:
  push:
  pull_request:
  schedule:
    # 03:00 UTC nightly - full matrix (all labels, all cases) on Linux + macOS.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} ${{ matrix.icon }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: "🐧", os: ubuntu-latest, arch: x86_64 }
          - { icon: "🍎", os: macos-14,      arch: arm64  }
          # macos-13 (x86_64 Intel) has been retired by GitHub
          # - { icon: "🍏", os: macos-13,      arch: x86_64 }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # System dependencies — mirrors the build workflow so cmake can configure
      # -----------------------------------------------------------------------
      - name: Install system dependencies (Linux) ${{ matrix.icon }}
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            ninja-build cmake \
            gfortran \
            libopenblas-dev liblapack-dev \
            libsymspg-dev libsymspg2 \
            openmpi-bin openmpi-common libopenmpi-dev
          sudo ldconfig
          symspg_lib="$(dpkg -L libsymspg2 | grep -m1 '/libsymspg\.so\.2$')"
          test -n "$symspg_lib"
          symspg_libdir="$(dirname "$symspg_lib")"
          echo "LD_LIBRARY_PATH=$symspg_libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install system dependencies (macOS) ${{ matrix.icon }}
        if: runner.os == 'macOS'
        run: |
          for pkg in cmake open-mpi spglib; do
            if ! brew list --versions "$pkg" >/dev/null 2>&1; then
              brew install "$pkg"
            fi
          done
          # Use the current Homebrew GCC/Open MPI pair on CI. GCC 13 is only
          # the local macOS workaround for the gfortran-16 issue.
          gfc=$(ls "$(brew --prefix)/bin/gfortran-"* 2>/dev/null | sort -V | tail -1)
          test -x "$gfc"
          sudo ln -sf "$gfc" "$(brew --prefix)/bin/gfortran"
          echo "FC=$gfc" >> "$GITHUB_ENV"
          echo "F77=$gfc" >> "$GITHUB_ENV"
          echo "F90=$gfc" >> "$GITHUB_ENV"
          spglib_lib="$(find -L "$(brew --prefix spglib)" -type f -name 'libsymspg*.dylib' -print -quit)"
          test -n "$spglib_lib"
          spglib_libdir="$(dirname "$spglib_lib")"
          echo "DYLD_LIBRARY_PATH=$spglib_libdir${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # Python — needs f90nml for run_test.py
      # -----------------------------------------------------------------------
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        # The GBT oracle/unit checks import NumPy in addition to f90nml.
        run: pip install f90nml numpy

      # -----------------------------------------------------------------------
      # Configure and build the checked-out source.
      # -----------------------------------------------------------------------
      - name: Configure CMake
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            generator="Unix Makefiles"
          else
            generator="Ninja"
          fi
          cmake -S . -B build -G "$generator" \
            -DENABLE_MPI=ON \
            -DENABLE_MARCH_NATIVE=OFF \
            -DRUN_REG_TESTS=ON \
            -DRUN_EXAMPLE_TESTS=ON \
            -DRUN_UNIT_TESTS=ON \
            -DEXAMPLE_PYTHON_EXECUTABLE="$(which python3)"

      - name: Build from source ${{ matrix.icon }}
        run: cmake --build build --parallel

      - name: Select MPI launcher
        run: |
          if command -v mpirun.openmpi >/dev/null 2>&1; then
            echo "RSLMTO_MPI_LAUNCHER=mpirun.openmpi" >> "$GITHUB_ENV"
          else
            echo "RSLMTO_MPI_LAUNCHER=mpirun" >> "$GITHUB_ENV"
          fi

      - name: Verify MPI runtime
        run: |
          if command -v "$RSLMTO_MPI_LAUNCHER" >/dev/null 2>&1; then
            echo "Using MPI launcher: $RSLMTO_MPI_LAUNCHER"
            "$RSLMTO_MPI_LAUNCHER" --version || true
          elif command -v mpiexec >/dev/null 2>&1; then
            echo "RSLMTO_MPI_LAUNCHER=mpiexec" >> "$GITHUB_ENV"
            echo "Fallback MPI launcher: mpiexec"
            mpiexec --version || true
          else
            echo "ERROR: no MPI launcher found (mpirun/mpiexec)"
            exit 1
          fi

      - name: Build standalone unit tests ${{ matrix.icon }}
        run: cmake --build build --target unit_tests --parallel

      # -----------------------------------------------------------------------
      # Run tests
      # -----------------------------------------------------------------------
      - name: Run unit correctness tests ${{ matrix.icon }}
        id: ctest_unit
        # GitHub's macOS and Ubuntu runners expose fewer MPI slots than the
        # four-rank parallel-context test intentionally exercises. This is a
        # CI resource limit, not an oversubscription condition in the code.
        # Linux uses Open MPI's legacy MCA setting; Homebrew Open MPI 5 uses
        # the PRRTE mapping-policy spelling.
        env:
          OMPI_MCA_rmaps_base_oversubscribe: ${{ runner.os == 'Linux' && '1' || '' }}
          PRTE_MCA_mapby: "${{ runner.os == 'macOS' && ':oversubscribe' || '' }}"
        run: |
          ctest --test-dir build \
            -L unit \
            --output-on-failure \
            --output-junit "${{ github.workspace }}/unit_results.xml" \
            --parallel 1 \
            -V 2>&1 | tee ctest_unit_output.txt
          echo "ctest_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run tooling tests ${{ matrix.icon }}
        id: ctest_tooling
        run: |
          ctest --test-dir build \
            -L tooling \
            --output-on-failure \
            --output-junit "${{ github.workspace }}/tooling_results.xml" \
            --parallel 1 \
            -V 2>&1 | tee ctest_tooling_output.txt
          echo "ctest_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run regression backend tests ${{ matrix.icon }}
        id: ctest_backend
        env:
          # Apply OpenMP threading only to non-MPI runs; MPI remains pinned to 1 in run_binary.sh.
          RSLMTO_OMP_THREADS_SERIAL: "2"
        run: |
          ctest --test-dir build \
            --label-regex backend \
            --output-on-failure \
            --output-junit "${{ github.workspace }}/backend_results.xml" \
            --parallel 1 \
            -V 2>&1 | tee ctest_backend_output.txt
          echo "ctest_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        # Always proceed to summary and upload steps even on failure
        continue-on-error: true

      - name: Run example tests ${{ matrix.icon }}
        id: ctest_example
        env:
          # Apply OpenMP threading only to non-MPI runs; MPI remains pinned to 1 in run_binary.sh.
          RSLMTO_OMP_THREADS_SERIAL: "2"
        run: |
          # pull_request runs a small representative "quick" subset to keep PR
          # turnaround under ~15 min; every other trigger (push, nightly
          # schedule, manual dispatch) runs the full example matrix.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LABEL_REGEX="quick"
          else
            LABEL_REGEX="example"
          fi
          ctest --test-dir build \
            --label-regex "$LABEL_REGEX" \
            --output-on-failure \
            --output-junit "${{ github.workspace }}/results.xml" \
            --parallel 1 \
            -V 2>&1 | tee ctest_output.txt
          echo "ctest_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        # Always proceed to summary and upload steps even on failure
        continue-on-error: true

      - name: Dump per-case runner logs on failure
        if: steps.ctest_unit.outputs.ctest_exit != '0' || steps.ctest_tooling.outputs.ctest_exit != '0' || steps.ctest_backend.outputs.ctest_exit != '0' || steps.ctest_example.outputs.ctest_exit != '0'
        run: |
          echo "ctest failed; printing per-case testrun.log files"
          find build/Testing -type f -name testrun.log | sort | while read -r f; do
            echo "===== ${f} ====="
            tail -n 200 "$f" || true
            echo
          done

          if [ -f build/Testing/Temporary/LastTest.log ]; then
            echo "===== build/Testing/Temporary/LastTest.log (tail) ====="
            tail -n 300 build/Testing/Temporary/LastTest.log || true
          fi

      # -----------------------------------------------------------------------
      # GitHub step summary — parsed from JUnit XML
      # -----------------------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          python3 - << 'PYEOF'
          import os, xml.etree.ElementTree as ET

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          def write_section(title, xml_name):
              xml_path = os.path.join(os.environ["GITHUB_WORKSPACE"], xml_name)

              if not os.path.exists(xml_path):
                  with open(summary_path, "a") as f:
                      f.write(f"## {title}\n\nNo results file found.\n")
                  return

              tree = ET.parse(xml_path)
              root = tree.getroot()
              suite = root.find("testsuite") or root

              passed, failed, skipped = [], [], []
              for tc in suite.findall("testcase"):
                  name = tc.attrib.get("name", "?")
                  time = float(tc.attrib.get("time", 0))
                  label = f"`{name}` ({time:.1f}s)"
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      el = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                      msg = el.text or ""
                      failed.append((label, msg.strip()))
                  elif tc.find("skipped") is not None:
                      skipped.append(label)
                  else:
                      passed.append(label)

              total = len(passed) + len(failed) + len(skipped)
              status = "✅ All passed" if not failed else f"❌ {len(failed)} failed"

              lines = [
                  f"## {title} — {status}",
                  "",
                  f"**{len(passed)}/{total} passed**"
                  + (f", {len(failed)} failed" if failed else "")
                  + (f", {len(skipped)} skipped" if skipped else ""),
                  "",
              ]

              if failed:
                  lines += ["### ❌ Failed", "", "| Test | Output |", "|------|--------|"]
                  for label, msg in failed:
                      # Truncate long messages for readability
                      short = msg.replace("\n", " ").replace("|", "\\|")[:200]
                      lines.append(f"| {label} | {short} |")
                  lines.append("")

              if passed:
                  lines += ["### ✅ Passed", "", "| Test |", "|------|"]
                  lines += [f"| {t} |" for t in passed]
                  lines.append("")

              with open(summary_path, "a") as f:
                  f.write("\n".join(lines) + "\n")

          write_section("Unit correctness tests", "unit_results.xml")
          write_section("Tooling tests", "tooling_results.xml")
          write_section("Regression backend tests", "backend_results.xml")
          write_section("Example tests", "results.xml")
          PYEOF

      # -----------------------------------------------------------------------
      # Upload artifacts for inspection
      # -----------------------------------------------------------------------
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test_logs.${{ runner.os }}.${{ matrix.arch }}
          path: |
            ctest_unit_output.txt
            unit_results.xml
            ctest_tooling_output.txt
            tooling_results.xml
            ctest_backend_output.txt
            backend_results.xml
            ctest_output.txt
            results.xml
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # Propagate failure after summary and upload are done
      # -----------------------------------------------------------------------
      - name: Check test outcome
        if: steps.ctest_unit.outputs.ctest_exit != '0' || steps.ctest_tooling.outputs.ctest_exit != '0' || steps.ctest_backend.outputs.ctest_exit != '0' || steps.ctest_example.outputs.ctest_exit != '0'
        run: |
          echo "Tests failed — see summary above for details."
          exit 1

  # ---------------------------------------------------------------------------
  # MKL: builds from source with ENABLE_MKL_KERNELS=ON and runs only the MKL
  # regression cases plus one MKL example case — the first time mkl_batch/
  # mkl_sparse actually execute in CI rather than silently skipping.
  # ---------------------------------------------------------------------------
  mkl:
    name: MKL kernels (Ubuntu)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get -y install ninja-build cmake gfortran

      - name: Install Intel oneAPI MKL
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get -y install intel-oneapi-mkl-devel

      - name: Export Intel oneAPI environment
        run: |
          source /opt/intel/oneapi/setvars.sh
          echo "MKLROOT=$MKLROOT" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install f90nml

      - name: Configure CMake with MKL kernels
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_MKL_KERNELS=ON \
            -DBLA_VENDOR=Intel10_64lp \
            -DRUN_REG_TESTS=ON \
            -DRUN_EXAMPLE_TESTS=ON \
            -DEXAMPLE_PYTHON_EXECUTABLE="$(which python3)"

      - name: Build
        run: cmake --build build --parallel

      - name: Run MKL regression + example cases
        run: |
          ctest --test-dir build \
            -R "mkl_batch|mkl_sparse" \
            --output-on-failure \
            --parallel 1 \
            -V

  # ---------------------------------------------------------------------------
  # CUDA (compile-only): builds the CUDA recursion plugin with no GPU present,
  # then runs the CPU regression subset against that binary (plugin compiled
  # in but unused). Catches interface drift between rsrec_cuda_plugin.f90,
  # rsrec_cuda.h and rsrec_gpu.cu without needing GPU hardware in CI.
  # ---------------------------------------------------------------------------
  cuda_compile:
    name: CUDA plugin (compile-only, Ubuntu)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            ninja-build cmake gfortran g++ nvidia-cuda-toolkit \
            libopenblas-dev liblapack-dev \
            libsymspg-dev libsymspg2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install f90nml

      - name: Configure CMake with CUDA plugin
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_CUDA_PLUGIN=ON \
            -DRUN_REG_TESTS=ON \
            -DEXAMPLE_PYTHON_EXECUTABLE="$(which python3)"

      - name: Build
        run: cmake --build build --parallel

      - name: Run CPU regression subset
        run: |
          ctest --test-dir build \
            --label-regex backend \
            --output-on-failure \
            --parallel 1 \
            -V

  # ---------------------------------------------------------------------------
  # Windows: binaries.yml builds Windows but never tests it. Best effort -
  # unverified against a real Windows/MSYS2 runner as of this commit
  # (authored and validated on Linux only), so continue-on-error: true keeps
  # it from blocking the pipeline if MSYS2 path/toolchain quirks surface.
  # Runs only the "quick" example subset (same one pull_request uses), not
  # the full matrix or MPI (binaries.yml builds Windows with ENABLE_MPI=OFF
  # to avoid MSYS2 MPI toolchain coupling issues - matched here).
  # ---------------------------------------------------------------------------
  windows_quick:
    name: Windows quick subset (MSYS2 UCRT64, best effort)

    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-blas
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-lapack
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-spglib
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            git

      - name: Install Python dependencies
        run: pip install f90nml

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_MPI=OFF \
            -DENABLE_MARCH_NATIVE=OFF \
            -DRUN_EXAMPLE_TESTS=ON \
            -DEXAMPLE_PYTHON_EXECUTABLE="$(which python3)"
          cmake --build build --parallel

      - name: Run quick example subset
        run: |
          ctest --test-dir build \
            --label-regex quick \
            --output-on-failure \
            --parallel 1 \
            -V

  # ---------------------------------------------------------------------------
  # libXC: opt-in functional baseline contract.  This stays separate from
  # the normal CPU matrix so libXC is not required for developer builds.
  # ---------------------------------------------------------------------------
  libxc_unit:
    name: libXC XC baseline (Ubuntu)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build cmake gfortran libopenblas-dev liblapack-dev libxc-dev

      - name: Configure libXC unit build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_MPI=OFF \
            -DENABLE_LIBXC=ON \
            -DRUN_UNIT_TESTS=ON

      - name: Build standalone unit tests
        run: cmake --build build --target unit_tests --parallel

      - name: Run libXC baseline test
        run: ctest --test-dir build -L libxc --output-on-failure -V
